; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = 
  WemosMini32
  NodeMCUv2
  WemosD1Mini
  WemosS2mini_C
  ESP32c3_SuperMini
  ESP32c6_SuperMini

[env]
extra_scripts = 
  pre:auto_firmware_version.py
  post:create_build_size.py
upload_speed = 921600
check_tool = clangtidy
build_unflags = 
  -std=gnu++11
  -include $PROJECT_DIR/include/config.h
  -Wall

[espressif8266_base]
platform = espressif8266
board_build.filesystem = littlefs
framework = arduino
lib_extra_dirs = 
  lib/JCA_FNC
  lib/JCA_IOT
  lib/JCA_SYS
lib_deps = 
	waspinator/AccelStepper@^1.64
	esp32async/ESPAsyncWebServer @^3.9.4
	esp32async/ESPAsyncTCP @^2.0.0
    me-no-dev/ESPAsyncUDP @ 0.0.0-alpha+sha.697c75a025
	bblanchon/ArduinoJson@^7.4.2
	paulstoffregen/OneWire@^2.3.8
	wollewald/INA219_WE@^1.4.1
	fbiego/ESP32Time@^2.0.6
	adafruit/Adafruit NeoPixel@^1.15.2
	fmalpartida/LiquidCrystal@1.5.0
	adafruit/MAX6675 library@^1.1.2
	adafruit/Adafruit SSD1306@^2.5.7
monitor_speed = 74880
monitor_filters = 
	esp8266_exception_decoder
	colorize
	time
build_flags = 
	-std=gnu++17
	-DCORE_DEBUG_LEVEL=0

[env:NodeMCUv2]
extends = espressif8266_base
board = nodemcuv2
build_flags = 
	${espressif8266_base.build_flags}
	-DJCA_IGNORE_CHARGER
	-DJCA_IGNORE_INA219
	-DJCA_IGNORE_LEDSTRIP
	-DJCA_IGNORE_VALVE2DPOSIMP
	-DJCA_IGNORE_CLOCKVALUES
	-DJCA_IGNORE_DAYSELECT
	-DJCA_IGNORE_PIDCONTROLLER
	-DJCA_IGNORE_MULTISWITCHCONTROLLER
	-DJCA_IGNORE_OLED128X64
	-DJCA_IGNORE_DS18B20
	-DJCA_IGNORE_DIGITALIN
	-DJCA_IGNORE_DIGITALOUT
	-DJCA_IGNORE_VALUEANALOG
	-DJCA_IGNORE_VALUEDIGITAL
	-DJCA_IGNORE_BUTTONVALUE

[env:WemosD1Mini]
extends = espressif8266_base
board = d1_mini
build_flags = 
	${espressif8266_base.build_flags}
	-DJCA_IGNORE_CHARGER
	-DJCA_IGNORE_INA219
	-DJCA_IGNORE_LEDSTRIP
	-DJCA_IGNORE_VALVE2DPOSIMP
	-DJCA_IGNORE_CLOCKVALUES
	-DJCA_IGNORE_DAYSELECT
	-DJCA_IGNORE_PIDCONTROLLER
	-DJCA_IGNORE_MULTISWITCHCONTROLLER
	-DJCA_IGNORE_OLED128X64
	-DJCA_IGNORE_DS18B20
	-DJCA_IGNORE_DIGITALIN
	-DJCA_IGNORE_DIGITALOUT
	-DJCA_IGNORE_VALUEANALOG
	-DJCA_IGNORE_VALUEDIGITAL
	-DJCA_IGNORE_BUTTONVALUE

[espressif32_base]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board_build.filesystem = littlefs
board_build.partitions = huge_app.csv
framework = arduino
lib_extra_dirs = 
  lib/JCA_FNC
  lib/JCA_IOT
  lib/JCA_SYS
lib_deps = 
	waspinator/AccelStepper@^1.64
	esp32async/ESPAsyncWebServer@^3.9.4
	esp32async/AsyncTCP@^3.4.10
	bblanchon/ArduinoJson@^7.4.2
	paulstoffregen/OneWire@^2.3.8
	wollewald/INA219_WE@^1.4.1
	fbiego/ESP32Time@^2.0.6
	adafruit/Adafruit NeoPixel@^1.15.2
	fmalpartida/LiquidCrystal@1.5.0
	adafruit/MAX6675 library@^1.1.2
	adafruit/Adafruit SSD1306@^2.5.7
monitor_speed = 115200
monitor_filters = 
	esp32_exception_decoder
	colorize
	time

[env:WemosMini32]
extends = espressif32_base
board = wemos_d1_mini32
build_flags = 
	-std=gnu++17
	-DCORE_DEBUG_LEVEL=0

[env:WemosS2mini]
extends = espressif32_base
board = lolin_s2_mini
build_flags = 
	-std=gnu++17
	-DCORE_DEBUG_LEVEL=0
	-DARDUINO_SERIAL_PORT=1
	-DARDUINO_USB_CDC_ON_BOOT=0

[env:ESP32c3_SuperMini]
extends = espressif32_base
board = esp32-c3-devkitm-1
build_flags = 
	-std=gnu++17

[env:ESP32c6_SuperMini]
extends = espressif32_base
board = esp32-c6-supermini
lib_deps = 
	waspinator/AccelStepper@^1.64
	esp32async/ESPAsyncWebServer@^3.9.4
	esp32async/AsyncTCP@^3.4.10
	bblanchon/ArduinoJson@^7.4.2
	https://github.com/PaulStoffregen/OneWire.git
	wollewald/INA219_WE@^1.4.1
	fbiego/ESP32Time@^2.0.6
	adafruit/Adafruit NeoPixel@^1.15.2
	fmalpartida/LiquidCrystal@1.5.0
	adafruit/MAX6675 library@^1.1.2
	adafruit/Adafruit SSD1306@^2.5.7
build_flags = 
	-std=gnu++17
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1

[env:WemosS2mini_C]
extends = espressif32_base
board = myWemosS2mini
build_flags = 
	-std=gnu++17

