<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>%TITLE%</title>
  <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
  <link rel="icon" type="image/png" href="/images/favicon.png">
  <link rel="stylesheet" type="text/css" href="/style/style.css">
  <link rel="stylesheet" type="text/css" href="/style/styleMobile.css">
  <link rel="stylesheet" type="text/css" href="/style/styleAddon.css">
  <style>
    :root {
      --ColorHome: var(--secondary);
      --ColorConfig: var(--contrast);
      --ColorSetup: var(--secondary);
      --ColorWiFi: var(--secondary);
      --ColorSystem: var(--secondary)
    }
  </style>
  <script src="/view.js"></script>
  <script type="text/javascript">
      var ws;
      function connectWS() {
        ws = new WebSocket("ws://" + location.host + "/ws");
      }
    function handleWsMsg(msg) {
      let DataObject = JSON.parse(msg.data);
      updateView(DataObject.elements, "config");
      updateView(DataObject.elements, "cmdInfo");
    }
    function onChange(ValueInput) {
      let OutData = getOnChangeObject(ValueInput);
      ensureWebSocketConnected(() => {
        ws.send(JSON.stringify(OutData));
      });
    }
    function onClick(ValueInput) {
      let OutData = getOnClickObject(ValueInput);
      ensureWebSocketConnected(() => {
        ws.send(JSON.stringify(OutData));
      });
    }
    function onSaveConfig() {
      location.href = '/configSave';
    }

    fetch("http://" + location.host + "/api/tags")
      .then(response => {
        return response.json();
      })
      .then(data => {
        console.log(data);
        createView(data, TagUsage_T.GetWebConfig);
      });
    //var ws = new WebSocket("ws://" + location.host + "/ws");
    connectWS();
    ws.onmessage = function (_msg) {
      handleWsMsg(_msg);
    };
  </script>
</head>

<body>
  <nav class="container-fluid">
    <ul>
      <li>%SVG_LOGO%</li>
      <li>Konfiguration</li>
    </ul>
    <ul>
      <li><a href="/home.htm">%SVG_HOME%</a></li>
      <li><a href="/config.htm">%SVG_CONFIG%</a></li>
      <li><a href="/setup.htm">%SVG_SETUP%</a></li>
      <li><a href="/connect">%SVG_WIFI%</a></li>
      <li><a href="/sys">%SVG_SYSTEM%</a></li>
    </ul>
  </nav>
  <main class="container">
    <section id="elements">
    </section>
    <button onclick="onSaveConfig()">Save Config</button>
  </main>
</body>
</ht???
